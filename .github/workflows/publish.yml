name: Publish to Pub.dev

on:
  workflow_dispatch: # Te permet de lancer la publication manuellement quand tu veux

jobs:
  publish:
    permissions:
      id-token: write # Indispensable pour que GitHub s'authentifie auprès de pub.dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Publish Package
        run: flutter pub publish --force --skip-validation